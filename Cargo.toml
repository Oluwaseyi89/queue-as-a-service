[workspace]
resolver = "3"
members = ["crates/*"]

# Shared metadata every crate in the workspace inherits via `field.workspace
# = true`. Keeping it here means bumping the version or edition for the
# whole project is a one-line change instead of four.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Isenewo Oluwaseyi Ephraim <isenewoephr2012@gmail.com>"]
repository = "https://github.com/Oluwaseyi89/queue-as-a-service"

# Path deps between our own crates, and every third-party dep pinned once
# here so version drift between crates isn't possible.
[workspace.dependencies]
qaas-types = { path = "crates/qaas-types" }
qaas-core = { path = "crates/qaas-core" }
qaas-client = { path = "crates/qaas-client" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
crc32fast = "1"
tempfile = "3"
fastrand = "2"
openraft = { version = "0.9", features = ["storage-v2", "serde"] }
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
sha2 = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
jsonwebtoken = "9"
tower = { version = "0.5", default-features = false, features = ["util"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
# Dev-only: its DebuggingRecorder is what actually lets qaas-server's own
# tests assert a gauge/histogram was recorded with the right value and
# labels, rather than only trusting the wiring compiles.
metrics-util = "0.20"
# Pinned to 0.32, not the newer 0.33 `opentelemetry`/`opentelemetry_sdk`/
# `opentelemetry-otlp` publish first: `tracing-opentelemetry` 0.33.0 (the
# bridge that actually matters here) still depends on `opentelemetry
# 0.32`, and Cargo's own SemVer rules treat every 0.x minor bump as
# breaking, so mixing 0.33 core crates with the 0.33 bridge produces two
# incompatible copies of the same types instead of one - caught by
# inspecting `tracing-opentelemetry`'s own installed `Cargo.toml` before
# picking versions, not assumed from "latest is always right."
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = { version = "0.33", default-features = false }

# Workspace-wide lint policy. Every member crate opts in with
# `[lints] workspace = true` so we don't have to repeat this four times.
# `missing_docs` is deliberately on: this project is meant to be heavily
# commented, and the lint is what actually enforces that over time instead
# of relying on code review to catch undocumented public items.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
