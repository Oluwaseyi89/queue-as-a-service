# Tells Grafana to auto-load any dashboard JSON file dropped into this
# same directory on startup.
#
# Still empty by design, not by omission: feature/monitoring-dashboard
# (Phase 6) built the queue-depth/DLQ/token-spend/top-agents dashboard
# this directory originally anticipated, but as a standalone page
# qaas-server itself serves directly (QAAS_DASHBOARD_ADDR, port 9091 in
# this dev stack - see crates/qaas-server/src/dashboard.rs's own module
# docs for the full reasoning: real-time polling and zero external
# infrastructure, rather than a Grafana panel depending on this stack
# being up at all). This provisioning slot is still live and still
# useful for anyone who wants a *second*, Grafana-native view over the
# same /metrics data feature/tracing-metrics exports - just not
# something any branch has populated.
apiVersion: 1

providers:
  - name: QaaS
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
