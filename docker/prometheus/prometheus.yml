# Local dev scrape config.
#
# feature/tracing-metrics landed qaas-server's own /metrics endpoint via
# metrics-exporter-prometheus's built-in HTTP listener - a plain
# Prometheus text-format scrape target, no OpenTelemetry Collector or
# OTLP involved on this path (that crate's own /metrics output is what's
# scraped here directly; QAAS_OTEL_ENDPOINT, if ever set, is a *separate*
# opt-in export of distributed traces, not metrics, to a collector this
# dev stack doesn't run). It listens on QAAS_METRICS_ADDR
# (docker-compose.yml sets this container's to 0.0.0.0:9090) - matching
# that here, not the OpenTelemetry Collector's own conventional 9464,
# which this project's exporter was never actually built to use.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: qaas-server
    static_configs:
      - targets: ["queue-node:9090"]
