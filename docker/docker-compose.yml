# Local dev stack: one qaas-server node plus Prometheus + Grafana, so
# contributors can build and iterate on metrics/dashboards without a real
# cluster. This is NOT the HA cluster — that's a future sibling compose
# file from feature/docker-ha-cluster (Phase 8), with N node replicas and
# a load balancer. Here it's one node, for one laptop.
#
# Run from the repo root with `just up`, or directly:
#   docker compose -f docker/docker-compose.yml up --build

services:
  queue-node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qaas-queue-node
    environment:
      RUST_LOG: info,qaas_server=debug
      # qaas-server's own defaults (127.0.0.1) are loopback-only on
      # purpose - see main.rs/telemetry.rs's own docs, the same
      # "reachable from nowhere by default" stance every listener it
      # binds takes. Inside a container that means unreachable even from
      # sibling containers on the same Docker network, not just from the
      # host - the `prometheus` service below scrapes this one by its
      # Docker DNS name (`queue-node`), which only resolves to anything
      # useful if this process is actually listening on an interface
      # other than its own loopback. 0.0.0.0 here is still safely
      # contained: nothing outside this compose network can reach these
      # ports unless the port mappings below publish them to the host.
      QAAS_HTTP_ADDR: "0.0.0.0:8080"
      QAAS_METRICS_ADDR: "0.0.0.0:9090"
      QAAS_DASHBOARD_ADDR: "0.0.0.0:9091"
    ports:
      # The MCP streamable-HTTP transport and the operator dashboard are
      # meant to be reached directly (an agent runtime, a browser), so
      # both get published to the host. The metrics port deliberately
      # doesn't: only the `prometheus` service needs to reach it, over
      # the Docker network by container name, and 9090 is already
      # `prometheus`'s own published host port below - publishing this
      # one too under the same number would collide.
      - "8080:8080"
      - "9091:9091"
    # qaas-server's stdio MCP transport is its entrypoint's own stdin -
    # without these, Compose gives that process no real stdin at all
    # (closed immediately, same as piping from /dev/null), and stdio is
    # the *only* place create_api_key can be called (see mcp.rs's own
    # docs on why) - with neither of these set, there would be no way to
    # mint the very API key the HTTP transport above requires. Attach to
    # it with `docker compose -f docker/docker-compose.yml attach
    # queue-node` once the stack is up (`just up-detached`, not the
    # foreground `just up`, which interleaves every service's own
    # stdout/stderr in one stream and isn't a usable place to type
    # JSON-RPC).
    stdin_open: true
    tty: true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: qaas-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: qaas-grafana
    environment:
      # Dev-only convenience: skip the login screen entirely. Never do
      # this in the production/HA stack (feature/docker-ha-cluster).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
