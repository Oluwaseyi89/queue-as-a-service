# cargo-deny configuration: run with `cargo deny check` once the tool is
# installed (`cargo install cargo-deny`). Wiring this into CI is
# `feature/cicd-pipeline`'s job — this file just defines the policy so
# that branch has something to enforce instead of inventing it under
# pipeline-deadline pressure.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

# Our own crates are deliberately unlicensed (see CLAUDE.md) and are
# workspace-local path dependencies, never published to crates.io — cargo-deny
# otherwise flags them as "unlicensed" the same way it would an external
# crate genuinely missing a license, which is a false positive here, not a
# real gap.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members reference each other via path dependencies with no
# semver requirement (`qaas-core.workspace = true`, resolving to a
# `{ path = "crates/qaas-core" }` entry) — cargo-deny's wildcard check
# otherwise treats that the same as an external `dep = "*"` version
# requirement, which is what `wildcards = "deny"` above is actually meant
# to catch. This exempts path dependencies specifically, not version
# wildcards in general.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
